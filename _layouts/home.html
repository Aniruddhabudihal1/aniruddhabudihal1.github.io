---
layout: base
---
<main id="main">
  <div class="listening-indicator" data-lastfm data-limit="1" data-source="{{ '/assets/data/lastfm.json' | relative_url }}"><span class="metadata">Last.fm · listening history unavailable</span></div>
  <header class="home-intro">
    {% include figlet.html %}
    <div class="introduction">
      <p>{{ site.data.home.introduction | escape }}</p>
      <p class="byline">{{ site.data.home.byline | escape }}</p>
    </div>
  </header>
  {{ content }}
  <section class="writing" aria-labelledby="writing-title">
    <div class="section-heading"><h2 id="writing-title">Writing</h2><a href="{{ '/blogs/' | relative_url }}">The archive →</a></div>
    {% include blog-list.html %}
  </section>
</main>

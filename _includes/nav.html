<header class="site-header">
  <nav aria-label="Main navigation">
    <a class="wordmark" href="{{ '/' | relative_url }}">~/budihal</a>
    <div class="nav-links">
      {% for item in site.navbar-links %}
      <a href="{{ item[1] | relative_url }}"{% if page.url == item[1] %} aria-current="page"{% endif %}>{{ item[0] }}</a>
      {% endfor %}
      <button class="theme-toggle" type="button" aria-label="Switch colour theme" hidden><span aria-hidden="true">☾</span></button>
    </div>
  </nav>
</header>
